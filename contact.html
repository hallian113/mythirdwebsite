<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact MD Travels | Bespoke Service</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">MD Travels</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="visas.html">Visas</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2 class="section-title">Inquiry Portal</h2>
        
        <div class="progress-container">
            <div class="step-circle active">1</div>
            <div class="step-circle">2</div>
            <div class="step-circle">3</div>
        </div>

        <form id="multiStepForm" style="max-width: 700px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 15px; box-shadow: var(--shadow);">
            
            <div class="form-step form-step-active">
                <h3 style="margin-bottom: 20px; color: var(--primary);">What can we help you with?</h3>
                <div class="service-grid">
                    <div class="option-card" onclick="selectOpt(this)">
                        <h4>Visa Processing</h4>
                        <p>K-ETA, Business, & Tourist</p>
                    </div>
                    <div class="option-card" onclick="selectOpt(this)">
                        <h4>Flight Tickets</h4>
                        <p>Premium & Business Class</p>
                    </div>
                </div>
                <div class="btn-group">
                    <div style="flex:1"></div>
                    <button type="button" class="btn next-step">Next Step</button>
                </div>
            </div>

            <div class="form-step">
                <h3 style="margin-bottom: 20px; color: var(--primary);">Travel Details</h3>
                <input type="text" placeholder="Destination City">
                <input type="date" placeholder="Departure Date">
                <textarea rows="4" placeholder="Special Requests (e.g., VIP Airport Pickup)"></textarea>
                <div class="btn-group">
                    <button type="button" class="btn btn-outline prev-step">Back</button>
                    <button type="button" class="btn next-step">Final Step</button>
                </div>
            </div>

            <div class="form-step">
                <h3 style="margin-bottom: 20px; color: var(--primary);">Secure Your Booking</h3>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="tel" placeholder="Phone Number">
                <div class="btn-group">
                    <button type="button" class="btn btn-outline prev-step">Back</button>
                    <button type="submit" class="btn">Submit Inquiry</button>
                </div>
            </div>
        </form>
    </section>

    <script>
        const nextBtns = document.querySelectorAll(".next-step");
        const prevBtns = document.querySelectorAll(".prev-step");
        const steps = document.querySelectorAll(".form-step");
        const circles = document.querySelectorAll(".step-circle");
        let activeStep = 0;

        nextBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                activeStep++;
                updateForm();
            });
        });

        prevBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                activeStep--;
                updateForm();
            });
        });

        function updateForm() {
            steps.forEach(step => step.classList.remove("form-step-active"));
            steps[activeStep].classList.add("form-step-active");
            
            circles.forEach((circle, index) => {
                index <= activeStep ? circle.classList.add("active") : circle.classList.remove("active");
            });
        }

        function selectOpt(el) {
            document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }
    </script>
</body>
</html>
